services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: vision-hub-mediamtx
    ports:
      - "8554:8554"
      - "8889:8889" 
      - "8189:8189/udp" 
    restart: unless-stopped
  ui-astro:
    build:
      context: ./ui-astro
    container_name: vision-hub-ui-astro
    ports:
      - "4321:4321"
    restart: unless-stopped
    depends_on: [web, yolo, pose]

  capture:
    image: jrottenberg/ffmpeg:6.1-ubuntu
    container_name: vision-hub-capture
    devices:
      - "${CAMERA_DEVICE:-/dev/v4l/by-id/usb-webcam_webcam_AN20200825001-video-index0}:/dev/video10"
    command: >
      -hide_banner -loglevel warning
      -fflags nobuffer -flags low_delay -thread_queue_size 64
      -use_wallclock_as_timestamps 1
      -f v4l2 -input_format h264 -framerate 30 -video_size 1280x720 -i /dev/video10
      -c:v copy
      -f rtsp -rtsp_transport udp -flush_packets 1 -max_interleave_delta 0
      rtsp://mediamtx:8554/cam
    restart: unless-stopped

  yolo:
    build: ./yolo
    container_name: vision-hub-yolo
    ports:
      - "5000:5000"
    devices:
      - "nvidia.com/gpu=all"
    environment:
    - CAMERA=${RTSP_URL:-rtsp://mediamtx:8554/cam}
    - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;udp|fflags;nobuffer|flush_packets;1|reorder_queue_size;0|max_delay;0|probesize;32000|analyzeduration;0|stimeout;2000000
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - IMG_SIZE=${IMG_SIZE:-640}
    - DRAW_LABELS=1
    - MODEL=${MODEL:-yolov8n.pt}
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: unless-stopped
    depends_on: [mediamtx, capture]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  pose:
    build: ./pose
    container_name: vision-hub-pose
    devices:
      - "nvidia.com/gpu=all"
    environment:
    - CAMERA=${RTSP_URL:-rtsp://mediamtx:8554/cam}
    - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;udp|fflags;nobuffer|flush_packets;1|reorder_queue_size;0|max_delay;0|probesize;32000|analyzeduration;0|stimeout;2000000
    - MODEL=${MODEL_POSE:-yolov8n-pose.pt}
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - RTSP_URL=${RTSP_URL:-rtsp://mediamtx:8554/cam}
    - IMG_SIZE=${IMG_SIZE:-640}
    restart: unless-stopped
    depends_on: [mediamtx, capture]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  web:
    build: ./web
    container_name: vision-hub-web
    ports: ["8080:8080"]
    restart: unless-stopped
    depends_on: [yolo, pose]
