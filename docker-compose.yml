name: vision-hub
networks:
  hub:
    name: vision-hub-net
    external: true


services:
# --- video capture + encodage H.264 low-latency ---
  capture:
    image: jrottenberg/ffmpeg:6.1-ubuntu
    container_name: vision-hub-capture
    devices:
      - "${CAMERA_DEVICE:-/dev/v4l/by-id/usb-webcam_webcam_AN20200825001-video-index0}:/dev/video10"
    command:
    - -hide_banner
    - -loglevel
    - error
    - -fflags
    - +discardcorrupt+nobuffer
    - -err_detect
    - ignore_err
    - -flags
    - low_delay
    - -thread_queue_size
    - "64"
    - -use_wallclock_as_timestamps
    - "1"
    - -f
    - v4l2
    - -input_format
    - "${CAMERA_FORMAT:-mjpeg}"    
    - -framerate
    - "${CAMERA_FPS:-30}"
    - -video_size
    - "${CAMERA_SIZE:-1280x720}"
    - -i
    - /dev/video10

    # --- encodage H.264 sans B-frames + faible latence ---
    - -c:v
    - "${CAMERA_OUTPUT:-libx264}"
    - -pix_fmt
    - yuv420p
    - -profile:v
    - baseline
    - -tune
    - zerolatency
    - -preset
    - veryfast
    - -bf
    - "0"              
    - -g
    - "${CAMERA_FPS:-30}"
    - -keyint_min
    - "${CAMERA_FPS:-30}"
    - -x264-params
    - "bframes=0:scenecut=0:rc-lookahead=0:ref=1"

    - -f
    - rtsp
    - -rtsp_transport
    - udp
    - -flush_packets
    - "1"
    - -max_interleave_delta
    - "0"
    - rtsp://mediamtx:8554/cam
    networks: [hub]
    restart: no

# --- Video proxy (RTSP, RTMP, HLS, WebRTC...) ---

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: vision-hub-mediamtx
    ports:
      - "8554:8554"
      - "8889:8889" 
      - "8189:8189/udp" 
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8554' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [hub]

# --- Web interface (Astro + React) ---

  ui-astro:
    build:
      context: ./ui-astro
      args:
        - PUBLIC_CONTACT_NAME=${CONTACT_NAME:-Tom Burellier}
        - PUBLIC_CONTACT_EMAIL=${CONTACT_EMAIL:-tom.burellier@associated.ltu.se}
    container_name: vision-hub-ui-astro
    ports:
      - "4321:4321"
    restart: unless-stopped
    depends_on: [mediamtx, api]
    networks: [hub]

    

# --- YOLOv8 Inference (via Ultralytics API) Object Detection + Pose Estimation ---
  yolo:
    build: ./yolo
    container_name: vision-hub-yolo
    ports:
      - "5000:5000"
    devices:
      - "nvidia.com/gpu=all"
    environment:
    - CAMERA=${RTSP_URL:-rtsp://mediamtx:8554/cam}
    - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;udp|fflags;nobuffer|flush_packets;1|reorder_queue_size;0|max_delay;0|probesize;32000|analyzeduration;0|stimeout;2000000
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - IMG_SIZE=${IMG_SIZE:-640}
    - DRAW_LABELS=1
    - MODEL=${MODEL:-yolov8n.pt}
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: unless-stopped
    depends_on: [mediamtx, capture]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -L -o /dev/null http://mediamtx:8889/annot/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    profiles: ["demo"]
    networks: [hub]


  pose:
    build: ./pose
    container_name: vision-hub-pose
    ports:
      - "5001:5000" # Flask/webSocket port for poses
    devices:
      - "nvidia.com/gpu=all"
    environment:
    - CAMERA=${RTSP_URL:-rtsp://mediamtx:8554/cam}
    - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;udp|fflags;nobuffer|flush_packets;1|reorder_queue_size;0|max_delay;0|probesize;32000|analyzeduration;0|stimeout;2000000
    - MODEL=${MODEL_POSE:-yolov8n-pose.pt}
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - RTSP_URL=${RTSP_URL:-rtsp://mediamtx:8554/cam}
    - IMG_SIZE=${IMG_SIZE:-640}
    - RTSP_URL=rtsp://mediamtx:8554/cam
    - ANNOT_URL=rtsp://mediamtx:8554/pose_annot
    - RTSP_TRANSPORT=udp
    - DRAW_ON_VIDEO=1          # drawing is optional; RTSP publish happens anyway
    - KP_THR=0.25
    - MODEL=yolov8n-pose.pt
    - MTX_HOST=mediamtx
    - MTX_RTSP_PORT=8554
    restart: unless-stopped
    depends_on: [mediamtx, capture]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -L -o /dev/null http://mediamtx:8889/pose_annot/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    profiles: ["demo"]
    networks: [hub]


# --- Orchestration API (FastAPI) ---
  api:
    build: ./API
    container_name: vision-hub-api
    ports: ["8090:8090"]
    environment:
      - ORCH_TOKEN=${ORCH_TOKEN:-dev-token}
      - ALLOW_ORIGINS=http://localhost:4321,http://127.0.0.1:4321
      - IDLE_SECONDS=${IDLE_SECONDS:-120}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - CONSENT_SECRET=${CONSENT_SECRET}
      - CONSENT_TTL_SECONDS=${CONSENT_TTL_SECONDS}
      - CONSENT_AUD=${CONSENT_AUD}
      - CAPTURE_NAME=vision-hub-capture
      - CAPTURE_IDLE_GRACE=180        # keep capture up 3 min after last demo
      - CAPTURE_MIN_DOWN=20           # don’t restart within 20s of stopping
      - CAPTURE_MIN_UP=60             # keep at least 60s up before stopping
      - CAPTURE_STARTUP_SETTLE=3      # wait 3s after start to let camera settle


    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mediamtx
    networks: [hub]
    restart: unless-stopped

