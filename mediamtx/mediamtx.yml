logLevel: debug

# RTSP
rtsp: yes
rtspAddress: :8554

# WebRTC / WHEP
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: "*"

# SRTP / ICE (v1.15.3 uses ONE UDP port)
webrtcLocalUDPAddress: :8189
# (TEMP for diagnostics) allow TCP fallback too:
webrtcLocalTCPAddress: :8189   # remove/empty once stable

# Candidate advertisement
webrtcIPsFromInterfaces: yes
webrtcIPsFromInterfacesList:
  - "eno1"
  - "wlp1s0"
webrtcAdditionalHosts:
  - "192.168.10.2"
  - "130.240.94.235"

# STUN
webrtcICEServers:
  - urls:
    - stun:stun.l.google.com:19302

paths:
  all:
    source: publisher
