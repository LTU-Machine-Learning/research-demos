logLevel: debug

# --- RTSP ---
rtsp: yes
rtspAddress: :8554

# --- WebRTC / WHEP ---
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: "*"     # CORS for the browser UI

# SRTP / ICE (v1.15.3 uses ONE UDP port)
webrtcLocalUDPAddress: :8189
# (TEMP while debugging; comment out once stable)
# webrtcLocalTCPAddress: :8189

# Advertise only the right NICs (avoid docker bridges/127.0.0.1)
webrtcIPsFromInterfaces: yes
webrtcIPsFromInterfacesList:
  - "eno1"            # 192.168.10.2
  - "wlp1s0"          # 130.240.94.235 (optionnel)
webrtcAdditionalHosts:
  - "192.168.10.2"
  - "130.240.94.235"

# STUN servers (must be plain strings in 1.15.3)
webrtcICEServers:
  - stun:stun.l.google.com:19302
  # - stun:stun.cloudflare.com:3478

# Accept any publisher path
paths:
  all:
    source: publisher
