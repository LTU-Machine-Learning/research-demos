logLevel: info

# --- WebRTC (v1.15.3) ---
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no

# CORS pour les requêtes WHEP depuis ton UI
webrtcAllowOrigin: "*"

# Écoute locale pour le trafic média WebRTC (UDP DTLS/SRTP)
# (En 1.15.3 c’est UN port, pas une plage)
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""   # désactivé (évite le fallback TCP)

# Annonce d’IP atteignable (remplace les anciens NAT1To1)
webrtcIPsFromInterfaces: yes
webrtcIPsFromInterfacesList: []  # ou garde vide
webrtcAdditionalHosts:
  - "192.168.10.2"               # IP LAN du nœud qui héberge MediaMTX

# STUN (format v1.15.3 = webrtcICEServers2)
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
    clientOnly: false

# Optionnel: HLS si tu veux tester facilement
hls: yes
hlsAddress: :8888
hlsAllowOrigin: "*"
