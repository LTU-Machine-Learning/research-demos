logLevel: info

# --- RTSP ---
rtsp: yes
rtspAddress: :8554

# --- WebRTC / WHEP ---
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: "*"

# SRTP / ICE UDP (un seul port en 1.15.3)
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""   # pas de fallback TCP

# N’annonce que les interfaces LAN + Wi-Fi (évite les ponts Docker)
webrtcIPsFromInterfaces: yes
webrtcIPsFromInterfacesList:
  - "eno1"       # ton LAN 192.168.10.2
  - "wlp1s0"     # ton Wi-Fi public (optionnel mais utile si accès depuis Internet)

# Pour forcer l’IP publique visible depuis l’extérieur (optionnel)
webrtcAdditionalHosts:
  - "192.168.10.2"
  - "130.240.94.235"

# Serveur STUN public pour aider les pairs à se découvrir
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
    clientOnly: false

# --- Définition des flux acceptés ---
paths:
  all:
    source: publisher
