# /srv/vision-hub/mediamtx.yml
logLevel: debug

rtsp: yes
rtspAddress: :8554

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: "*"

# 1.15.3 = un seul port UDP pour ICE/SRTP
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""   # pas de fallback TCP (on le remettra si besoin)

# N’annonce QUE les bonnes interfaces (évite 172.x docker)
webrtcIPsFromInterfaces: yes
webrtcIPsFromInterfacesList:
  - "eno1"    # 192.168.10.2 (LAN)
  # - "wlp1s0" # (désactive-le pour l’instant → évite candidats 130.240.x)
# Pas d'additionalHosts au début, on simplifie
# webrtcAdditionalHosts: []

# STUN: on va d’abord TESTER SANS (voir A/B plus bas). Pour l’instant: pas de STUN.
# webrtcICEServers2: []

paths:
  all:
    source: publisher
