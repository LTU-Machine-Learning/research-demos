version: "3.8"

networks:
  hub:
    name: vision-hub-net
    external: true

services:
  # --- Media proxy (frontend) ---
  mediamtx:
    image: bluenviron/mediamtx:latest
    networks: [hub]
    ports:
      - target: 8554
        published: 8554
        protocol: tcp
        mode: host
      - target: 8889
        published: 8889
        protocol: tcp
        mode: host
      - target: 8189
        published: 8189
        protocol: udp
        mode: host
    deploy:
      placement:
        constraints:
          - node.labels.role == frontend
      restart_policy:
        condition: any

  # --- Web UI (frontend) ---
  ui-astro:
    image: ui-astro:local
    networks: [hub]
    ports:
      - target: 4321
        published: 4321
        protocol: tcp
        mode: host
    deploy:
      placement:
        constraints:
          - node.labels.role == frontend
      restart_policy:
        condition: any

  # --- Price API (frontend) ---
  price-api:
    image: vision-hub/price-api:latest
    networks: [hub]
    environment:
      - TZ=Europe/Stockholm
      - MODEL_DIR=/app/model
      - ALLOW_ORIGINS=http://localhost:4321,http://127.0.0.1:4321
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    volumes:
      - /srv/vision-hub/model:/app/model:ro
    # (healthcheck retiré côté mediamtx; celui-ci garde le sien si endpoint /healthz existe)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      placement:
        constraints:
          - node.labels.role == frontend
      restart_policy:
        condition: any

  # --- Orchestration API (frontend manager) ---
  api:
    image: api:local
    networks: [hub]
    environment:
      - ORCH_TOKEN=${ORCH_TOKEN:-dev-token}
      - ALLOW_ORIGINS=http://localhost:4321,http://127.0.0.1:4321
      - IDLE_SECONDS=${IDLE_SECONDS:-120}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - CONSENT_SECRET=${CONSENT_SECRET}
      - CONSENT_TTL_SECONDS=${CONSENT_TTL_SECONDS}
      - CONSENT_AUD=${CONSENT_AUD}
      - CAPTURE_NAME=vision-hub-capture
      - CAPTURE_IDLE_GRACE=180
      - CAPTURE_MIN_DOWN=20
      - CAPTURE_MIN_UP=60
      - CAPTURE_STARTUP_SETTLE=3
    ports:
      - target: 8090
        published: 8090
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      placement:
        constraints:
          - node.labels.role == frontend
          - node.role == manager
      restart_policy:
        condition: any

  # --- YOLO (GPU node) ---
  yolo:
    image: yolo:local
    networks: [hub]
    environment:
      # IMPORTANT: RTSP en TCP et URL stable (par défaut via DNS overlay)
      - CAMERA=${CAMERA_URL:-rtsp://192.168.10.2:8554/cam}
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp|fflags;nobuffer|flush_packets;1|reorder_queue_size;0|max_delay;0|probesize;32000|analyzeduration;0|stimeout;2000000
      - IMG_SIZE=${IMG_SIZE:-640}
      - DRAW_LABELS=1
      - MODEL=${MODEL:-yolov8n.pt}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: host
    # healthcheck supprimé (les endpoints /annot n'existent pas côté MediaMTX)
    deploy:
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: any

  # --- Pose (GPU node) ---
  pose:
    image: pose:local
    networks: [hub]
    environment:
      - CAMERA=${CAMERA_URL:-rtsp://192.168.10.2:8554/cam}
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp|fflags;nobuffer|flush_packets;1|reorder_queue_size;0|max_delay;0|probesize;32000|analyzeduration;0|stimeout;2000000
      - MODEL=${MODEL_POSE:-yolov8n-pose.pt}
      - IMG_SIZE=${IMG_SIZE:-640}
      - ANNOT_URL=rtsp://mediamtx:8554/pose_annot
      - RTSP_TRANSPORT=tcp
      - DRAW_ON_VIDEO=1
      - KP_THR=0.25
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - target: 5000
        published: 5001
        protocol: tcp
        mode: host
    # healthcheck supprimé (même raison)
    deploy:
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: any
