version: "3.8"

networks:
  hub:
    name: vision-hub-net
    external: true

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    volumes:
      - /srv/vision-hub/mediamtx.yml:/mediamtx.yml:ro
    networks:
      hub:
        aliases: [mediamtx]
    ports:
      - target: 8554
        published: ${MEDIAMTX_RTSP_PORT:-8554}
        protocol: tcp   # RTSP
      - target: 8889
        published: ${MEDIAMTX_HTTP_PORT:-8889}
        protocol: tcp   # WHEP/WHIP HTTP
      - target: 8189
        published: ${MEDIAMTX_WEBRTC_PORT:-8189}
        protocol: udp   # WebRTC (UN SEUL port en 1.15.3)
      - target: 8189
        published: ${MEDIAMTX_WEBRTC_PORT:-8189}
        protocol: tcp   # WebRTC TCP (TEMP while debugging)
    deploy:
      placement:
        constraints:
          - node.labels.role == frontend
    init: true

  ui-astro:
    image: ui-astro:local
    networks:
      hub:
        aliases: [ui-astro]
    ports:
      - target: 4321
        published: ${FRONTEND_PORT:-4321}
        protocol: tcp
    deploy:
      placement:
        constraints:
          - node.labels.role == frontend
      restart_policy:
        condition: any
      update_config:
        order: start-first
        parallelism: 1
        delay: 2s
    init: true

  price-api:
    image: vision-hub/price-api:latest
    networks:
      hub:
        aliases: [price-api]
    environment:
      - TZ=Europe/Stockholm
      - MODEL_DIR=/app/model
      - ALLOW_ORIGINS=${ALLOW_ORIGINS:-http://localhost:4321,http://127.0.0.1:4321,http://ui-astro:4321,http://api:8090}
    ports:
      - target: 8080
        published: ${PRICE_API_PORT:-8080}
        protocol: tcp
    volumes:
      - /srv/vision-hub/model:/app/model:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: any
      update_config:
        order: start-first
        parallelism: 1
        delay: 2s
    init: true

  api:
    image: api:local
    networks: [hub]
    environment:
      - ORCH_TOKEN=${ORCH_TOKEN:-dev-token}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS:-http://localhost:4321,http://127.0.0.1:4321}
      - STACK_NAME=${STACK_NAME:-vision-hub}
      - PUBLIC_BASE=${PUBLIC_BASE:-http://${FRONTEND_HOST:-localhost}}
      - IDLE_SECONDS=${IDLE_SECONDS:-120}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - CONSENT_SECRET=${CONSENT_SECRET}
      - CONSENT_TTL_SECONDS=${CONSENT_TTL_SECONDS:-600}
      - CONSENT_AUD=${CONSENT_AUD}
      - CAPTURE_NAME=${CAPTURE_NAME:-vision-hub-capture}
      - CAPTURE_IDLE_GRACE=${CAPTURE_IDLE_GRACE:-180}
      - CAPTURE_MIN_DOWN=${CAPTURE_MIN_DOWN:-20}
      - CAPTURE_MIN_UP=${CAPTURE_MIN_UP:-60}
      - CAPTURE_STARTUP_SETTLE=${CAPTURE_STARTUP_SETTLE:-3}
    ports:
      - target: 8090
        published: ${API_PORT:-8090}
        protocol: tcp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      placement:
        constraints:
          - node.labels.role == frontend
          - node.role == manager
      restart_policy:
        condition: any
      update_config:
        order: start-first
        parallelism: 1
        delay: 2s
    init: true

  yolo:
    image: yolo:local
    networks:
      hub:
        aliases: [yolo]
    environment:
      - CAMERA=${CAMERA_URL:-rtsp://mediamtx:8554/cam}
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;udp|fflags;nobuffer|flush_packets;1|reorder_queue_size;0|max_delay;0|probesize;32000|analyzeduration;0|stimeout;2000000
      - IMG_SIZE=${IMG_SIZE:-640}
      - DRAW_LABELS=1
      - MODEL=${MODEL:-yolov8n.pt}
      - NVIDIA_VISIBLE_DEVICES=MIG-a9f45d7b-d898-5aa5-afa7-f815daa3b81c
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - target: 6000
        published: ${YOLO_PORT:-6002}
        protocol: tcp
    deploy:
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: any
      update_config:
        order: start-first
        parallelism: 1
        delay: 2s
    init: true

  pose:
    image: pose:local
    networks:
      hub:
        aliases: [pose]
    environment:
      - CAMERA=${CAMERA_URL:-rtsp://mediamtx:8554/cam}
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;udp|fflags;nobuffer|flush_packets;1|reorder_queue_size;0|max_delay;0|probesize;32000|analyzeduration;0|stimeout;2000000
      - MODEL=${MODEL_POSE:-yolov8n-pose.pt}
      - IMG_SIZE=${IMG_SIZE:-640}
      - ANNOT_URL=rtsp://mediamtx:8554/pose_annot
      - RTSP_TRANSPORT=udp
      - DRAW_ON_VIDEO=1
      - KP_THR=0.25
      - NVIDIA_VISIBLE_DEVICES=MIG-a9f45d7b-d898-5aa5-afa7-f815daa3b81c
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - target: 6000
        published: ${POSE_PORT:-6001}
        protocol: tcp
    deploy:
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: any
      update_config:
        order: start-first
        parallelism: 1
        delay: 2s
    init: true
